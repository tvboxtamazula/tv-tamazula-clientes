name: TV TAMAZULA CLIENTES APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Crear APK
        run: gradle wrapper --gradle-version 8.9 && ./gradlew assembleDebug

      - name: Preparar APK para descarga
        run: cp app/build/outputs/apk/debug/app-debug.apk tamazulatv.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: TV-TAMAZULA-CLIENTES
          path: tamazulatv.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV TAMAZULA CLIENTES ${{ github.run_number }}
          body: Nueva versión de TV TAMAZULA CLIENTES.
          make_latest: true
          files: tamazulatv.apk
          fail_on_unmatched_files: true
